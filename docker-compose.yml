services:
  postgres:
    image: postgres:16-alpine
    container_name: estuda-db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: estuda
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-questions:
    image: postgres:17-alpine
    container_name: questions-db
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: questions
    volumes:
      - questions-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: estuda-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  questions-pgdata:
  redisdata:
